name: Web

on:
  push:
    branches: [main]
    paths: ['Ananeo/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['Ananeo/web/**', '.github/workflows/web.yml']

defaults:
  run:
    working-directory: Ananeo/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ananeo/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    # Deploys ananeo.app from main when the Cloudflare secrets are set. Skipped otherwise, so the
    # Cloudflare Git integration can own deploys instead if that is preferred.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      VITE_SIGN_IN_METHODS: ${{ vars.VITE_SIGN_IN_METHODS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ananeo/web/package-lock.json
      - run: npm ci
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.VITE_SUPABASE_URL != ''
        run: npm run deploy
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.VITE_SUPABASE_URL == ''
        run: echo "Cloudflare or Supabase secrets are not set; nothing deployed."
